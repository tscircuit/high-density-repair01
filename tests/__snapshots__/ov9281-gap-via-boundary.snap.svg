stroke-width="29.629629629629285" stroke-dasharray="0.03 0.03"/></g><g><polyline data-points="-35.99000099999999,1.9755517368954205 -35.89199999999999,1.978" data-type="line" data-label="" points="513.3330370370368,299.1328186976534 542.3703703703704,298.40740740740773" fill="none" stroke="#2563eb" stroke-width="29.629629629629285"/></g><g><polyline data-points="-35.89199999999999,1.978 -35.94999999999999,2.036" data-type="line" data-label="" points="542.3703703703704,298.40740740740773 525.1851851851843,281.22222222222274" fill="none" stroke="#2563eb" stroke-width="29.629629629629285"/></g><g><polyline data-points="-35.94999999999999,2.036 -35.96899999999999,2.053" data-type="line" data-label="" points="525.1851851851843,281.22222222222274 519.5555555555566,276.1851851851858" fill="none" stroke="#2563eb" stroke-width="29.629629629629285"/></g><g><polyline data-points="-35.96899999999999,2.053 -35.98399999999999,2.064" data-type="line" data-label="" points="519.5555555555566,276.1851851851858 515.1111111111113,272.92592592592655" fill="none" stroke="#2563eb" stroke-width="29.629629629629285"/></g><g><polyline data-points="-35.98399999999999,2.064 -35.99299999999999,2.076" data-type="line" data-label="" points="515.1111111111113,272.92592592592655 512.4444444444453,269.370370370371" fill="none" stroke="#2563eb" stroke-width="29.629629629629285"/></g><g><polyline data-points="-35.99299999999999,2.076 -36.01899999999999,2.116" data-type="line" data-label="" points="512.4444444444453,269.370370370371 504.7407407407409,257.5185185185193" fill="none" stroke="#2563eb" stroke-width="29.629629629629285"/></g><g><polyline data-points="-36.01899999999999,2.116 -36.01399999999999,2.149" data-type="line" data-label="" points="504.7407407407409,257.5185185185193 506.2222222222226,247.74074074074167" fill="none" stroke="#2563eb" stroke-width="29.629629629629285"/></g><g><rect data-type="rect" data-label="Free region" data-x="-37.23875" data-y="1.9815" x="40" y="247.74074074074167" width="206.66666666666606" height="99.25925925925799" fill="rgba(148,163,184,0.12)" stroke="#94a3b8" stroke-width="0.0033750000000000394"/></g><g><rect data-type="rect" data-label="pcb_smtpad_354" data-x="-36.8475" data-y="1.714" x="229.62962962962956" y="346.99999999999966" width="59.259259259259125" height="59.25925925925867" fill="rgba(220,38,38,0.2)" stroke="#dc2626" stroke-width="0.0033750000000000394"/></g><g><rect data-type="rect" data-label="Free region" data-x="-36.18874999999999" data-y="1.9815" x="351.1111111111113" y="247.74074074074167" width="206.66666666666606" height="99.25925925925799" fill="rgba(148,163,184,0.12)" stroke="#94a3b8" stroke-width="0.0033750000000000394"/></g><g><rect data-type="rect" data-label="pcb_smtpad_354" data-x="-35.797499999999985" data-y="1.714" x="540.7407407407409" y="346.99999999999966" width="59.259259259259125" height="59.25925925925867" fill="rgba(220,38,38,0.2)" stroke="#dc2626" stroke-width="0.0033750000000000394"/></g><circle data-type="circle" data-label="" data-x="-37.019375" data-y="1.9657500000000003" cx="208.33333333333394" cy="302.0370370370372" r="44.444444444443924" fill="rgba(37,99,235,0.2)" stroke="#2563eb" stroke-width="0.0033750000000000394"/><circle data-type="circle" data-label="" data-x="-35.99000099999999" data-y="1.9755517368954205" cx="513.3330370370368" cy="299.1328186976534" r="44.444444444443924" fill="rgba(37,99,235,0.2)" stroke="#2563eb" stroke-width="0.0033750000000000394"/><text data-type="text" data-label="Before cleanup" data-x="-37.167500000000004" data-y="2.1962500000000005" x="164.44444444444343" y="233.74074074074167" fill="black" font-size="13.999999999999998" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Before cleanup</text><text data-type="text" data-label="After cleanup" data-x="-36.11749999999999" data-y="2.1962500000000005" x="475.55555555555475" y="233.74074074074167" fill="black" font-size="13.999999999999998" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">After cleanup</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":296.29629629629284,"c":0,"e":11177.03703703691,"b":0,"d":-296.29629629629284,"f":884.4814814814749};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>