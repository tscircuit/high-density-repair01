<svg width="700" height="780" viewBox="0 0 700 780" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><text x="20" y="30" font-family="sans-serif" font-size="20">RVboy: preserve regional clearance during cleanup</text><text x="20" y="58" font-family="sans-serif" font-size="15">After: the validated regional detour stays intact</text><svg y="80" width="700" height="700" viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="0.8249999999999998,11.379999999999999 1.1500000000000004,10.75" data-type="line" data-label="" points="367.22222222222223,132.31111111111136 412.00000000000006,219.1111111111111" fill="none" stroke="#a855f7" stroke-width="13.777777777777779"/></g><g><polyline data-points="1.1500000000000004,10.75 1.1500000000000004,8.15" data-type="line" data-label="" points="412.00000000000006,219.1111111111111 412.00000000000006,577.3333333333333" fill="none" stroke="#a855f7" stroke-width="13.777777777777779"/></g><g><polyline data-points="1.1500000000000004,8.15 1.1749999999999998,10.699999999999996" data-type="line" data-label="" points="412.00000000000006,577.3333333333333 415.44444444444446,226.00000000000068" fill="none" stroke="#a855f7" stroke-width="13.777777777777779"/></g><g><polyline data-points="0.8249999999999998,11.379999999999999 1.35,11.38" data-type="line" data-label="" points="367.22222222222223,132.31111111111136 439.55555555555554,132.31111111111113" fill="none" stroke="#a855f7" stroke-width="13.777777777777779"/></g><g><polyline data-points="1.35,11.38 1.35,11.38" data-type="line" data-label="" points="439.55555555555554,132.31111111111113 439.55555555555554,132.31111111111113" fill="none" stroke="#a855f7" stroke-width="13.777777777777779"/></g><g><polyline data-points="1.35,11.38 1.35,11.38" data-type="line" data-label="" points="439.55555555555554,132.31111111111113 439.55555555555554,132.31111111111113" fill="none" stroke="#a855f7" stroke-width="13.777777777777779"/></g><g><polyline data-points="1.35,11.38 1.35,11.38" data-type="line" data-label="" points="439.55555555555554,132.31111111111113 439.55555555555554,132.31111111111113" fill="none" stroke="#a855f7" stroke-width="13.777777777777779"/></g><g><polyline data-points="1.35,11.38 1.075,11.38" data-type="line" data-label="" points="439.55555555555554,132.31111111111113 401.66666666666663,132.31111111111113" fill="none" stroke="#a855f7" stroke-width="13.777777777777779"/></g><g><polyline data-points="1.075,11.38 0.8249999999999998,10.699999999999996" data-type="line" data-label="" points="401.66666666666663,132.31111111111113 367.22222222222223,226.00000000000068" fill="none" stroke="#a855f7" stroke-width="13.777777777777779"/></g><g><polyline data-points="0.475,10.699999999999996 0.5499999999999998,8.15" data-type="line" data-label="" points="319,226.00000000000068 329.3333333333333,577.3333333333333" fill="none" stroke="#2563eb" stroke-width="13.777777777777779"/></g><g><polyline data-points="0.5499999999999998,8.15 0.8249999999999998,10.699999999999996" data-type="line" data-label="" points="329.3333333333333,577.3333333333333 367.22222222222223,226.00000000000068" fill="none" stroke="#2563eb" stroke-width="13.777777777777779"/></g><g><rect data-type="rect" data-label="Original node" data-x="0.8249999999999998" data-y="11.039999999999997" x="294.8888888888889" y="132.31111111111136" width="144.66666666666663" height="93.68888888888932" fill="none" stroke="#64748b" stroke-width="0.007258064516129033"/></g><g><rect data-type="rect" data-label="" data-x="0.7" data-y="9.8" x="129.55555555555554" y="40" width="440.8888888888889" height="620" fill="none" stroke="none" stroke-width="0.007258064516129033"/></g><circle data-type="circle" data-label="" data-x="0" data-y="11" cx="253.55555555555557" cy="184.66666666666674" r="41.33333333333333" fill="#ef4444" stroke="black" stroke-width="0.007258064516129033"/><circle data-type="circle" data-label="" data-x="1.1500000000000004" data-y="8.15" cx="412.00000000000006" cy="577.3333333333333" r="31" fill="#2563eb" stroke="black" stroke-width="0.007258064516129033"/><circle data-type="circle" data-label="" data-x="0.5499999999999998" data-y="8.15" cx="329.3333333333333" cy="577.3333333333333" r="31" fill="#2563eb" stroke="black" stroke-width="0.007258064516129033"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="700" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="700" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '700');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '700');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":137.77777777777777,"c":0,"e":253.55555555555557,"b":0,"d":-137.77777777777777,"f":1700.2222222222222};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg></svg>