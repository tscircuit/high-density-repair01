<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="160.44751147368083,106.39941010691219 160.26041500691758,106.44015784160167" data-type="line" data-label="" points="490.52602493743325,565.7382019632532 437.04379420263285,554.0903083055855" fill="none" stroke="#ef4444" stroke-width="28.585377190726252"/></g><g><polyline data-points="160.26041500691758,106.44015784160167 160.2722894989381,106.44440162826584" data-type="line" data-label="" points="437.04379420263285,554.0903083055855 440.4381625361857,552.8772058804643" fill="none" stroke="#ef4444" stroke-width="28.585377190726252"/></g><g><polyline data-points="160.2722894989381,106.44440162826584 159.91255970754966,106.51955232855177" data-type="line" data-label="" points="440.4381625361857,552.8772058804643 337.60804480038496,531.39509474226" fill="none" stroke="#ef4444" stroke-width="28.585377190726252"/></g><g><polyline data-points="159.91255970754966,106.51955232855177 160.03419741467906,106.66285154015249" data-type="line" data-label="" points="337.60804480038496,531.39509474226 372.3786421894765,490.4324745948579" fill="none" stroke="#f97316" stroke-width="28.585377190726252"/></g><g><polyline data-points="160.03419741467906,106.66285154015249 160.01706036273447,106.6761644980931" data-type="line" data-label="" points="372.3786421894765,490.4324745948579 367.479951251742,486.6269153522917" fill="none" stroke="#f97316" stroke-width="28.585377190726252"/></g><g><polyline data-points="160.01706036273447,106.6761644980931 160.03066571726933,106.67049126390494" data-type="line" data-label="" points="367.479951251742,486.6269153522917 371.36909316366655,488.24863074389214" fill="none" stroke="#f97316" stroke-width="28.585377190726252"/></g><g><polyline data-points="160.03066571726933,106.67049126390494 159.91216553126972,106.51983130036493" data-type="line" data-label="" points="371.36909316366655,488.24863074389214 337.4953680239705,531.315349597211" fill="none" stroke="#f97316" stroke-width="28.585377190726252"/></g><g><polyline data-points="159.91216553126972,106.51983130036493 160.03085089447683,106.69227173514574" data-type="line" data-label="" points="337.4953680239705,531.315349597211 371.4220267669007,482.02260088578987" fill="none" stroke="#3b82f6" stroke-width="28.585377190726252"/></g><g><polyline data-points="160.03085089447683,106.69227173514574 160.04939214678038,106.9542288280147" data-type="line" data-label="" points="371.4220267669007,482.02260088578987 376.7221136737571,407.14117781133245" fill="none" stroke="#3b82f6" stroke-width="28.585377190726252"/></g><g><polyline data-points="160.04939214678038,106.9542288280147 160.063,107.43078943218939" data-type="line" data-label="" points="376.7221136737571,407.14117781133245 380.6119698441398,270.91453156559874" fill="none" stroke="#3b82f6" stroke-width="28.585377190726252"/></g><g><polyline data-points="160.063,107.43078943218939 159.540388501284,107.95340093090536" data-type="line" data-label="" points="380.6119698441398,270.91453156559874 231.2215016940754,121.52406341553069" fill="none" stroke="#3b82f6" stroke-width="28.585377190726252"/></g><g><polyline data-points="159.540388501284,107.95340093090536 159.540388501284,107.9538743025915" data-type="line" data-label="" points="231.2215016940754,121.52406341553069 231.2215016940754,121.38874833353111" fill="none" stroke="#3b82f6" stroke-width="28.585377190726252"/></g><g><polyline data-points="159.540388501284,107.9538743025915 159.4944117723919,107.99859592018812" data-type="line" data-label="" points="231.2215016940754,121.38874833353111 218.07888032031042,108.60490525774367" fill="none" stroke="#3b82f6" stroke-width="28.585377190726252"/></g><g><polyline data-points="159.4944117723919,107.99859592018812 159.44751147368083,107.94781497227834" data-type="line" data-label="" points="218.07888032031042,108.60490525774367 204.6722530301704,123.12083075878036" fill="none" stroke="#ef4444" stroke-width="28.585377190726252"/></g><g><polyline data-points="159.44751147368083,107.94781497227834 159.434271543007,107.93347953629275" data-type="line" data-label="" points="204.6722530301704,123.12083075878036 200.88756890725926,127.21866920719549" fill="none" stroke="#ef4444" stroke-width="28.585377190726252"/></g><circle data-type="circle" data-label="" data-x="159.91255970754966" data-y="106.51955232855177" cx="337.60804480038496" cy="531.39509474226" r="68.604905257743" fill="#dc2626" stroke="#dc2626" stroke-width="0.003498292127922044"/><circle data-type="circle" data-label="" data-x="159.91216553126972" data-y="106.51983130036493" cx="337.4953680239705" cy="531.315349597211" r="68.604905257743" fill="#dc2626" stroke="#dc2626" stroke-width="0.003498292127922044"/><circle data-type="circle" data-label="" data-x="159.4944117723919" data-y="107.99859592018812" cx="218.07888032031042" cy="108.60490525774367" r="68.604905257743" fill="#dc2626" stroke="#dc2626" stroke-width="0.003498292127922044"/><circle data-type="circle" data-label="" data-x="159.913" data-y="106.52" cx="337.73390405806276" cy="531.2671261702089" r="42.87806578608937" fill="#22c55e" stroke="#14532d" stroke-width="0.003498292127922044"/><circle data-type="circle" data-label="" data-x="159.912" data-y="106.52" cx="337.4480502861479" cy="531.2671261702089" r="42.87806578608937" fill="#22c55e" stroke="#14532d" stroke-width="0.003498292127922044"/><circle data-type="circle" data-label="" data-x="159.494" data-y="107.999" cx="217.96117362891528" cy="108.48939751936632" r="42.87806578608937" fill="#22c55e" stroke="#14532d" stroke-width="0.003498292127922044"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":285.8537719072625,"c":0,"e":-45374.00032294801,"b":0,"d":-285.8537719072625,"f":30980.41090973181};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>