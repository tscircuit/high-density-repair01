<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="160.44751147368083,106.39941010691219 160.26041500691758,106.44015784160167" data-type="line" data-label="" points="493.61458584429056,590.6014917450957 434.72113214817364,577.7750879777013" fill="none" stroke="#ef4444" stroke-width="31.4775873189769"/></g><g><polyline data-points="160.26041500691758,106.44015784160167 160.2722894989381,106.44440162826584" data-type="line" data-label="" points="434.72113214817364,577.7750879777013 438.4589357426157,576.4392463248587" fill="none" stroke="#ef4444" stroke-width="31.4775873189769"/></g><g><polyline data-points="160.2722894989381,106.44440162826584 159.91255970754966,106.51955232855177" data-type="line" data-label="" points="438.4589357426157,576.4392463248587 325.2246765459422,552.7836190215312" fill="none" stroke="#ef4444" stroke-width="31.4775873189769"/></g><g><polyline data-points="159.91255970754966,106.51955232855177 160.03419741467906,106.66285154015249" data-type="line" data-label="" points="325.2246765459422,552.7836190215312 363.51329202040506,507.6764845625148" fill="none" stroke="#f97316" stroke-width="31.4775873189769"/></g><g><polyline data-points="160.03419741467906,106.66285154015249 160.01706036273447,106.6761644980931" data-type="line" data-label="" points="363.51329202040506,507.6764845625148 358.118961530643,503.48588660201494" fill="none" stroke="#f97316" stroke-width="31.4775873189769"/></g><g><polyline data-points="160.01706036273447,106.6761644980931 160.03066571726933,106.67049126390494" data-type="line" data-label="" points="358.118961530643,503.48588660201494 362.4015988844112,505.271683847408" fill="none" stroke="#f97316" stroke-width="31.4775873189769"/></g><g><polyline data-points="160.03066571726933,106.67049126390494 159.91216553126972,106.51983130036493" data-type="line" data-label="" points="362.4015988844112,505.271683847408 325.10059936323523,552.6958054254501" fill="none" stroke="#f97316" stroke-width="31.4775873189769"/></g><g><polyline data-points="159.91216553126972,106.51983130036493 160.03085089447683,106.69227173514574" data-type="line" data-label="" points="325.10059936323523,552.6958054254501 362.4598882015998,498.4157169940954" fill="none" stroke="#3b82f6" stroke-width="31.4775873189769"/></g><g><polyline data-points="160.03085089447683,106.69227173514574 160.04939214678038,106.9542288280147" data-type="line" data-label="" points="362.4598882015998,498.4157169940954 368.29622708547686,415.9579443480179" fill="none" stroke="#3b82f6" stroke-width="31.4775873189769"/></g><g><polyline data-points="160.04939214678038,106.9542288280147 160.063,107.43078943218939" data-type="line" data-label="" points="368.29622708547686,415.9579443480179 372.5796509649226,265.9481640410886" fill="none" stroke="#3b82f6" stroke-width="31.4775873189769"/></g><g><polyline data-points="160.063,107.43078943218939 159.540388501284,107.95340093090536" data-type="line" data-label="" points="372.5796509649226,265.9481640410886 208.07416011758323,101.44267319374921" fill="none" stroke="#3b82f6" stroke-width="31.4775873189769"/></g><g><polyline data-points="159.540388501284,107.95340093090536 159.540388501284,107.9538743025915" data-type="line" data-label="" points="208.07416011758323,101.44267319374921 208.07416011758323,101.29366720790131" fill="none" stroke="#3b82f6" stroke-width="31.4775873189769"/></g><g><polyline data-points="159.540388501284,107.9538743025915 159.4944117723919,107.99859592018812" data-type="line" data-label="" points="208.07416011758323,101.29366720790131 193.6017951341637,87.2163809784688" fill="none" stroke="#3b82f6" stroke-width="31.4775873189769"/></g><g><polyline data-points="159.4944117723919,107.99859592018812 159.44751147368083,107.94781497227834" data-type="line" data-label="" points="193.6017951341637,87.2163809784688 178.83871265452763,103.20099819817551" fill="none" stroke="#ef4444" stroke-width="31.4775873189769"/></g><g><polyline data-points="159.44751147368083,107.94781497227834 159.434271543007,107.93347953629275" data-type="line" data-label="" points="178.83871265452763,103.20099819817551 174.67110191569373,107.71344757809129" fill="none" stroke="#ef4444" stroke-width="31.4775873189769"/></g><circle data-type="circle" data-label="" data-x="159.91255970754966" data-y="106.51955232855177" cx="325.2246765459422" cy="552.7836190215312" r="47.21638097846535" fill="#22c55e" stroke="#14532d" stroke-width="0.003176863556493511"/><circle data-type="circle" data-label="" data-x="159.91216553126972" data-y="106.51983130036493" cx="325.10059936323523" cy="552.6958054254501" r="47.21638097846535" fill="#22c55e" stroke="#14532d" stroke-width="0.003176863556493511"/><circle data-type="circle" data-label="" data-x="159.4944117723919" data-y="107.99859592018812" cx="193.6017951341637" cy="87.2163809784688" r="47.21638097846535" fill="#22c55e" stroke="#14532d" stroke-width="0.003176863556493511"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":314.775873189769,"c":0,"e":-50011.39093940907,"b":0,"d":-314.775873189769,"f":34082.56871502471};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>