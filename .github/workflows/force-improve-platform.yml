name: Force improvement platform parity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install
      - run: bun test tests/gameboy-force-improve-platform.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: force-improve-${{ matrix.os }}
          path: tmp/gameboy-force-improve-routes.json

  compare:
    needs: route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results
      - name: Require identical Linux and macOS route geometry
        run: diff -u results/force-improve-ubuntu-latest/gameboy-force-improve-routes.json results/force-improve-macos-14/gameboy-force-improve-routes.json
